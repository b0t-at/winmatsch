name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    name: Validate tag and run full test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid release tag (expected v<major>.<minor>.<patch>[-prerelease])."
            exit 1
          fi

      - name: Verify CLI project exists
        shell: bash
        run: |
          if [[ ! -f src/WinMatsch.Cli/WinMatsch.Cli.csproj ]]; then
            echo "::error::src/WinMatsch.Cli/WinMatsch.Cli.csproj is missing; refusing to release."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~WinMatsch.E2E.Tests" --logger "console;verbosity=normal"

      - name: Hermetic end-to-end tests
        run: dotnet test tests/WinMatsch.E2E.Tests/WinMatsch.E2E.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  publish:
    name: Publish (${{ matrix.rid }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            smoke: true
          - os: windows-latest
            rid: win-arm64
            smoke: false
          - os: ubuntu-latest
            rid: linux-x64
            smoke: true
          - os: ubuntu-latest
            rid: linux-arm64
            smoke: false
          - os: macos-latest
            rid: osx-x64
            smoke: false
          - os: macos-latest
            rid: osx-arm64
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          test -f src/WinMatsch.Cli/WinMatsch.Cli.csproj
          dotnet publish src/WinMatsch.Cli/WinMatsch.Cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:SuppressTrimAnalysisWarnings=false \
            -p:Version=${GITHUB_REF_NAME#v} \
            --output publish/${{ matrix.rid }}

      - name: Verify publish output
        shell: bash
        run: |
          set -euo pipefail
          dir=publish/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*) exe="$dir/winmatsch.exe" ;;
            *)     exe="$dir/winmatsch" ;;
          esac
          for f in "$exe" "$dir/LICENSE" "$dir/THIRD-PARTY-NOTICES.txt"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Expected release file '$f' is missing."
              exit 1
            fi
          done

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            win-*) exe=publish/${{ matrix.rid }}/winmatsch.exe ;;
            *)     exe=publish/${{ matrix.rid }}/winmatsch ;;
          esac
          version=$("$exe" --version)
          echo "winmatsch --version: $version"
          if [[ "${version%%+*}" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Executable version '$version' does not match tag version '${GITHUB_REF_NAME#v}'."
            exit 1
          fi
          "$exe" --help > /dev/null
          "$exe" analyze --help > /dev/null
          "$exe" completion bash > /dev/null
          "$exe" config path > /dev/null

      - name: Package (zip)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/winmatsch-${env:GITHUB_REF_NAME}-${{ matrix.rid }}.zip"

      - name: Package (tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/winmatsch-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winmatsch-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create draft release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify archives and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/* dist/
          cd dist
          expected=(
            "winmatsch-$GITHUB_REF_NAME-win-x64.zip"
            "winmatsch-$GITHUB_REF_NAME-win-arm64.zip"
            "winmatsch-$GITHUB_REF_NAME-linux-x64.tar.gz"
            "winmatsch-$GITHUB_REF_NAME-linux-arm64.tar.gz"
            "winmatsch-$GITHUB_REF_NAME-osx-x64.tar.gz"
            "winmatsch-$GITHUB_REF_NAME-osx-arm64.tar.gz"
          )
          for f in "${expected[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Expected release archive '$f' is missing."
              exit 1
            fi
          done
          for f in *.zip; do unzip -t "$f" > /dev/null; done
          for f in *.tar.gz; do tar -tzf "$f" > /dev/null; done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
