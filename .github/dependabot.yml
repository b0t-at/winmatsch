# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Weekly grouped updates with cooldown: new releases mature before a PR
# is opened; security updates bypass cooldown and schedule automatically.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # JsonSchema.Net majors are license-gated: from 9.0.0 the binaries ship
      # the OSMFEULA maintenance-fee EULA. See the hold-back comment in
      # Directory.Packages.props and issue #9 (self-built validator). GitHub
      # security alerts still fire; only the automatic PRs are suppressed.
      - dependency-name: "JsonSchema.Net"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive as one batch; majors stay
      # individual PRs so breaking changes get reviewed in isolation.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
