# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Weekly grouped updates with cooldown: new releases mature before a PR
# is opened; security updates bypass cooldown and schedule automatically.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Minor and patch updates arrive as one batch; majors stay
      # individual PRs so breaking changes get reviewed in isolation.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
